[package]
name = "monitoring"
version = "0.1.0"
edition = "2024"

[dependencies]
chrono = "0.4.45"
duckdb = { version = "1.10505.0", features = ["modern-full"] }
ragent = { git = "https://github.com/alexpdp7/ragent.git", version = "7.0.2" }
rand = "0.10.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["macros", "rt", "time", "process"] }
ureq = { version = "3.4.2", features = ["json"] }
