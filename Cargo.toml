[package]
name = "monitoring"
version = "0.1.0"
edition = "2024"

[dependencies]
chrono = "0.4.45"
duckdb = { version = "1.20000.1", features = ["modern-full"] }
ragent = { git = "https://github.com/alexpdp7/ragent.git", version = "7.1.1" }
rand = "0.10.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["macros", "rt", "time", "process"] }
ureq = { version = "3.5.1", features = ["json"] }
